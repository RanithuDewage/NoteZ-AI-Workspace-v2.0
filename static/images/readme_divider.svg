<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0" />
      <stop offset="25%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes slideGlow {
        0% { transform: translateX(-450px); }
        50% { transform: translateX(450px); }
        100% { transform: translateX(-450px); }
      }
      .scanner { animation: slideGlow 5s ease-in-out infinite; }
    </style>
  </defs>
  <line x1="50" y1="12" x2="1150" y2="12" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" />
  <g class="scanner">
    <rect x="560" y="9" width="80" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
    <circle cx="600" cy="12" r="5" fill="#ffffff" />
  </g>
</svg>
