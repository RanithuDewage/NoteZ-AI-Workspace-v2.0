<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="skyIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="meteorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 64px; fill: #f8fafc; }
      .z-accent { fill: url(#skyIndigo); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
      .pill-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13.5px; fill: #e2e8f0; }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      @keyframes meteorShoot {
        0% { transform: translate(-150px, -80px) rotate(25deg); opacity: 0; }
        10% { opacity: 1; }
        40% { transform: translate(650px, 290px) rotate(25deg); opacity: 0; }
        100% { transform: translate(650px, 290px) rotate(25deg); opacity: 0; }
      }

      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .orb-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 250px 190px; }
      .orb-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 950px 180px; }
      .float-card-1 { animation: floatSlow 5s ease-in-out infinite; }
      .float-card-2 { animation: floatReverse 6s ease-in-out infinite; }
      .star-1 { animation: twinkle 3s ease-in-out infinite; }
      .star-2 { animation: twinkle 4.2s ease-in-out infinite 1.2s; }
      .star-3 { animation: twinkle 3.6s ease-in-out infinite 2.1s; }
      .meteor { animation: meteorShoot 7s linear infinite 1s; }
      .data-line { stroke-dasharray: 6 6; animation: dashFlow 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="24" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="1196" height="376" rx="22" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Ambient Glowing Orbs -->
  <circle class="orb-1" cx="250" cy="190" r="140" fill="#0ea5e9" filter="url(#softGlow)" />
  <circle class="orb-2" cx="950" cy="180" r="150" fill="#6366f1" filter="url(#softGlow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="95" x2="1200" y2="95" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="285" x2="1200" y2="285" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
  </g>

  <!-- Shooting Meteor -->
  <g class="meteor">
    <line x1="0" y1="0" x2="110" y2="0" stroke="url(#meteorGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="110" cy="0" r="2.5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Twinkling Stars -->
  <g fill="#38bdf8">
    <circle class="star-1" cx="120" cy="65" r="2.2" />
    <circle class="star-2" cx="480" cy="50" r="1.8" fill="#fde047" />
    <circle class="star-3" cx="760" cy="70" r="2.5" fill="#818cf8" />
    <circle class="star-1" cx="1080" cy="60" r="2" fill="#34d399" />
    <circle class="star-2" cx="85" cy="310" r="2" fill="#c084fc" />
    <circle class="star-3" cx="670" cy="330" r="1.8" fill="#38bdf8" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(70, 62)">
    <!-- Top Version Pill -->
    <rect x="0" y="0" width="295" height="32" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text">WORKSPACE VERSION 2.0 • PRO</text>

    <!-- Main Brand Title -->
    <text x="0" y="104" class="title">Note<tspan class="z-accent">Z</tspan> AI</text>
    <rect x="295" y="64" width="58" height="28" rx="8" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2" />
    <text x="310" y="83" class="badge-text" style="font-size: 12px;">v2.0</text>

    <!-- Subtitle -->
    <text x="0" y="144" class="subtitle">Next-Gen Intelligent Desktop &amp; Web Note-Taking Ecosystem</text>
    <text x="0" y="172" class="subtitle" style="font-size: 16px; fill: #64748b;">Visual WYSIWYG Canvas • Gemini Pro AI • 3D Flashcards • Mind Map • Kanban</text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="155" height="38" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="20" y="24" class="pill-text">✨ Gemini Pro AI</text>

      <rect x="168" y="0" width="165" height="38" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="188" y="24" class="pill-text">🧠 Mind Map View</text>

      <rect x="346" y="0" width="162" height="38" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <text x="364" y="24" class="pill-text">📋 Kanban Board</text>

      <rect x="520" y="0" width="165" height="38" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
      <text x="538" y="24" class="pill-text">🔒 PIN &amp; AES-256</text>
    </g>
  </g>

  <!-- Right Animated Visual Graphic (Floating UI Cards & Neural Nodes) -->
  <g transform="translate(800, 48)">
    <!-- Connecting Animated Data Lines -->
    <path class="data-line" d="M 80 140 L 220 80" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path class="data-line" d="M 80 140 L 230 215" stroke="#818cf8" stroke-width="2" fill="none" />
    <path class="data-line" d="M 220 80 L 230 215" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Card 1: AI Note Card -->
    <g class="float-card-1">
      <rect x="0" y="75" width="190" height="125" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="26" cy="102" r="8" fill="#0ea5e9" />
      <rect x="44" y="96" width="95" height="10" rx="5" fill="#e2e8f0" />
      <rect x="20" y="122" width="145" height="7" rx="3.5" fill="#64748b" />
      <rect x="20" y="138" width="120" height="7" rx="3.5" fill="#64748b" />
      <rect x="20" y="154" width="135" height="7" rx="3.5" fill="#64748b" />
      <rect x="20" y="172" width="75" height="16" rx="8" fill="#0ea5e9" fill-opacity="0.2" />
      <text x="30" y="184" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">#AI-Summary</text>
    </g>

    <!-- Card 2: Analytics & Streak Card -->
    <g class="float-card-2" transform="translate(155, 10)">
      <rect x="0" y="0" width="175" height="100" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" />
      <text x="18" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c084fc">🔥 7-Day Streak</text>
      <polyline points="20,78 48,60 76,68 105,45 135,52 155,32" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="155" cy="32" r="4.5" fill="#fde047" filter="url(#glow)" />
    </g>

    <!-- Card 3: Code Runner & Flashcards Badge -->
    <g class="float-card-2" transform="translate(145, 175)">
      <rect x="0" y="0" width="185" height="92" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
      <text x="18" y="28" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34d399">💻 Live Python Runner</text>
      <rect x="18" y="40" width="148" height="36" rx="6" fill="#060b18" />
      <text x="26" y="62" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">&gt;&gt;&gt; run_ai_notes()</text>
    </g>
  </g>
</svg>
